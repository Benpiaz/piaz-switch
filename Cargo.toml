[workspace]
resolver = "2"
members = ["crates/pitstop-core", "crates/pitstop-cli", "crates/pitstop-app"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "LicenseRef-MIT-Commons-Clause"
repository = "https://github.com/Benpiaz/piaz-switch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
