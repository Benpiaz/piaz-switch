name: Release

on:
  push:
    tags: ["v*"]
  # A trial run (Actions → Release → Run workflow): it builds, signs and
  # notarizes everything and keeps the files on the run, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          # macos-15, not macos-latest: GitHub often finds no runner for the
          # latest macOS image and cancels the job (see ci.yml).
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15
            target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The app reports the Cargo version and the updater compares it with the
      # tag's: a mismatch would offer the same update forever.
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - name: Build (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p pitstop-cli --target ${{ matrix.target }}
          cd crates/pitstop-app
          npx --yes @tauri-apps/cli@^2 build --bundles nsis --target ${{ matrix.target }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # Without a Developer ID signature and Apple's notarization, macOS refuses
      # to open the app on any other Mac. The certificate (a .p12, base64) goes
      # into a keychain of its own; Package signs with it (MAC_SIGN_IDENTITY) and
      # sends the app, the CLI and the disk image to Apple. The six secrets are
      # in "Releasing" in CONTRIBUTING.md.
      - name: Mac signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing ${missing[*]}: a Mac release has to be signed and notarized, or macOS won't open it."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$APPLE_SIGNING_IDENTITY\""; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::APPLE_SIGNING_IDENTITY is not the certificate's name."
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          # The updater's key (see "Releasing" in CONTRIBUTING.md). Without it the
          # release still builds, but the apps out there aren't offered it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          # Sends a file to Apple and waits; on a refusal prints Apple's log and fails.
          notarize() {
            local result id
            result=$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json) || true
            echo "$result"
            if [[ "$(jq -r '.status // empty' <<<"$result" || true)" != Accepted ]]; then
              id=$(jq -r '.id // empty' <<<"$result" || true)
              [[ -z "$id" ]] || xcrun notarytool log "$id" --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Apple did not accept $1 (its answer is above)."
              exit 1
            fi
          }
          mkdir dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$dir"/bundle/nsis/*-setup.exe "dist/PiazSwitch-windows-${{ matrix.arch }}-setup.exe"
            update="PiazSwitch-windows-${{ matrix.arch }}-setup.exe"
            name="PiazSwitch-windows-${{ matrix.arch }}-portable"
            mkdir "$name"
            cp "$dir/pitstop-app.exe" "$name/Piaz Switch.exe"
            cp "$dir/piaz-switch.exe" README.md LICENSE "$name/"
            7z a "dist/$name.zip" "$name" >/dev/null
          else
            app="$dir/Piaz Switch.app"
            dmg="dist/PiazSwitch-macos-${{ matrix.arch }}.dmg"
            sh crates/pitstop-app/macos/bundle.sh "$dir/pitstop-app"
            codesign --force --options runtime --timestamp --sign "$MAC_SIGN_IDENTITY" "$dir/piaz-switch"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep '^Authority=Developer ID Application'
            codesign --display --entitlements - "$app" 2>&1 | grep -q com.apple.security.automation.apple-events
            # Apple's ticket is stapled to the app itself, so it opens offline and
            # the update archive below carries it too.
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
            notarize "$RUNNER_TEMP/app.zip"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            mkdir dmg
            cp -R "$app" dmg/
            ln -s /Applications dmg/Applications
            hdiutil create -volname "Piaz Switch" -srcfolder dmg -ov -format UDZO "$dmg"
            codesign --force --timestamp --sign "$MAC_SIGN_IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            # A bare binary can't hold a ticket: Gatekeeper asks Apple online.
            ditto -c -k "$dir/piaz-switch" "$RUNNER_TEMP/cli.zip"
            notarize "$RUNNER_TEMP/cli.zip"
            spctl --assess --type execute --verbose=4 "$app" || true
            # What the updater installs: the app bundle alone, no ._ files.
            update="PiazSwitch-macos-${{ matrix.arch }}.app.tar.gz"
            COPYFILE_DISABLE=1 tar czf "dist/$update" -C "$dir" "Piaz Switch.app"
            name="piaz-switch-cli-macos-${{ matrix.arch }}"
            mkdir "$name"
            cp "$dir/piaz-switch" README.md LICENSE "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
          cd dist
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Trial run: $update is not signed for the updater."
          elif [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            # Bound to its version: the app (requireSignedVersion) refuses a
            # latest.json that pairs a newer number with an older signed file.
            npx --yes @tauri-apps/cli@^2 signer sign --app-version "${GITHUB_REF_NAME#v}" "$update"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: $update is not signed, so the app won't offer this release as an update."
          fi
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          for f in *; do
            [[ "$f" == *.sig ]] || $sum "$f" > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          cp changes.md notes.md
          cat >> notes.md <<'EOF'

          ## Download

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit) | `PiazSwitch-windows-x64-setup.exe` (installer) or `PiazSwitch-windows-x64-portable.zip` |
          | macOS 11+, Apple Silicon | `PiazSwitch-macos-arm64.dmg` |
          | macOS 11+, Intel | `PiazSwitch-macos-x64.dmg` |

          The macOS app is signed and notarized by Apple, so it opens like any other app. The Windows build isn't code-signed yet: on the first install click **More info → Run anyway**.
          Each download has a `.sha256` checksum next to it. The `.sig` files and `latest.json` are for the app's own updater.
          EOF
          cat notes.md
      - name: Updater manifest (latest.json)
        run: |
          set -euo pipefail
          # The apps read releases/latest/download/latest.json: one entry per
          # build whose update file was signed.
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          platforms='{}'
          for pair in windows-x86_64=PiazSwitch-windows-x64-setup.exe \
                      darwin-aarch64=PiazSwitch-macos-arm64.app.tar.gz \
                      darwin-x86_64=PiazSwitch-macos-x64.app.tar.gz; do
            target="${pair%%=*}"
            file="${pair#*=}"
            if [[ ! -f "dist/$file.sig" ]]; then
              echo "::warning::$file is not signed: $target gets no update"
              continue
            fi
            platforms=$(jq --arg t "$target" --arg url "$base/$file" --rawfile sig "dist/$file.sig" \
              '. + {($t): {url: $url, signature: $sig}}' <<<"$platforms")
          done
          if [[ "$platforms" == '{}' ]]; then
            echo "::warning::nothing was signed, so there is no latest.json"
            exit 0
          fi
          jq -n --arg version "${GITHUB_REF_NAME#v}" --rawfile notes changes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: ($notes | sub("^\\s+"; "") | sub("\\s+$"; "")),
              pub_date: $date, platforms: $platforms}' > dist/latest.json
          cat dist/latest.json
      - uses: softprops/action-gh-release@v3
        with:
          name: Piaz Switch ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
