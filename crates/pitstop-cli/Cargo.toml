[package]
name = "pitstop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "piaz-switch"
path = "src/main.rs"

[dependencies]
pitstop-core = { path = "../pitstop-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
