[package]
name = "pitstop-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pitstop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pitstop-core = { path = "../pitstop-core" }
# custom-protocol: the window always loads the bundled `ui/`; there is no dev server.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
dirs = "7"
# No "zip": the Windows update is the NSIS setup.exe itself, not an archive.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# The Jump List: the shell's destination list, shell links and their title.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
base64.workspace = true
tempfile = "3"
